name: ⚽ Resumen largo diario de resultados

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-results-longform.js'
      - 'scripts/fetch-matches.js'
      - 'src/ChileLongform.tsx'
      - 'src/ResultsThumbnail.tsx'
      - 'src/index.tsx'
      - '.github/workflows/resultados-largos-diarios.yml'
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Visibilidad del vídeo'
        required: true
        default: 'public'
        type: choice
        options: ['public', 'unlisted', 'private']

concurrency:
  group: daily-football-results
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-longform:
    if: github.event_name == 'push'
    name: 🧪 Validar producción y miniatura sin publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validar JavaScript y TypeScript
        run: |
          node --check scripts/fetch-matches.js
          node --check scripts/generate-results-longform.js
          node --check scripts/generate-narration.js
          npm run lint
          npm run test:publication-policy
      - name: Renderizar miniatura de prueba
        run: npx remotion still src/index.tsx ResultsThumbnail /tmp/results-thumbnail.png --props='{"date":"2026-10-16","count":3}' --frame=0 --scale=1

  results-longform:
    if: github.event_name != 'push'
    name: 📊 Resultados verificados → vídeo 16:9
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_VERSION: '24'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ⚽ Obtener resultados de los últimos días
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          COMPETITIONS: ${{ secrets.COMPETITIONS }}
        run: node scripts/fetch-matches.js
      - name: 🧪 Validar scripts
        run: |
          node --check scripts/fetch-matches.js
          node --check scripts/generate-results-longform.js
          node --check scripts/youtube-auth.js
          node -e "JSON.parse(require('fs').readFileSync('tsconfig.json','utf8'))"
          npm run test:publication-policy
      - name: 🔐 Validar canal y OAuth
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: UCQbAT9x3pVmV5oRAtwoKmKA
        run: node scripts/preflight-youtube-auth.js
      - name: 🎬 Renderizar y publicar resumen largo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: UCQbAT9x3pVmV5oRAtwoKmKA
          RESULTS_VIDEO_PRIVACY: ${{ inputs.privacy || vars.RESULTS_VIDEO_PRIVACY || 'public' }}
          PUBLISH_TO_YOUTUBE: 'true'
        run: node scripts/generate-results-longform.js
      - name: 📦 Guardar reporte
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resultados-largos-${{ github.run_number }}
          path: |
            out/*/reporte-resultados.json
            out/*/resumen-resultados.mp4
            out/*/miniatura-resultados.png
          if-no-files-found: ignore
          retention-days: 7
