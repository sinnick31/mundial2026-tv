name: ⚽ REAL FOOTBALL NEWSROOM v5 — Chile 365

# Canal editorial de fútbol chileno con trazabilidad de fuentes.
# La automatización NO inventa resultados, cifras, fichajes ni declaraciones.
# Prioridad: 1) Colo-Colo, 2) fútbol chileno, 3) futbolistas chilenos en el exterior.
# Máximo 3 Shorts/día + resumen largo periódico.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 20 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Máximo de Shorts en esta ejecución'
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3']
      modo:
        description: 'Enfoque editorial'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'noticias', 'chile']
      resumen_largo:
        description: 'Generar también resumen horizontal largo'
        required: false
        default: true
        type: boolean

concurrency:
  group: real-football-newsroom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  generate:
    name: 📰 Fuentes reales + selección editorial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      hay_contenido: ${{ steps.gen.outputs.hay_contenido }}
      hay_longform: ${{ steps.longform.outputs.hay_longform }}
      fecha: ${{ steps.gen.outputs.fecha }}

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Instalar dependencias
        run: npm ci

      - name: 🔍 Ingerir fuentes reales
        run: node scripts/fetch-real-news.js

      - name: ⚽ Obtener datos estructurados de fútbol internacional
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          COMPETITIONS: ${{ secrets.COMPETITIONS }}
        run: node scripts/fetch-matches.js

      - name: 🧭 Generar paquete editorial source-locked
        id: gen
        env:
          MAX_ITEMS: ${{ inputs.max_items || '1' }}
          MODO: ${{ inputs.modo || 'auto' }}
        run: |
          node scripts/generate-real-content.js
          FECHA=$(date -u +%Y-%m-%d)
          echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"
          TOTAL=$(node -e "const f=require('./daily-content.json'); console.log(f.total||0)")
          echo "📊 Piezas verificables seleccionadas: $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then echo "hay_contenido=true" >> "$GITHUB_OUTPUT"; else echo "hay_contenido=false" >> "$GITHUB_OUTPUT"; fi

      - name: 🧭 Generar resumen largo
        id: longform
        env:
          LONGFORM_REQUESTED: ${{ inputs.resumen_largo || 'false' }}
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          RUN_LONGFORM=false
          if [ "$EVENTO" = "schedule" ] && [ "$CRON" = "0 20 * * *" ]; then RUN_LONGFORM=true; fi
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$LONGFORM_REQUESTED" = "true" ]; then RUN_LONGFORM=true; fi
          if [ "$EVENTO" = "push" ]; then RUN_LONGFORM=true; fi
          if [ "$RUN_LONGFORM" = "true" ]; then
            node scripts/generate-longform-content.js
          else
            printf '%s\n' '{"fecha":"'"$(date -u +%Y-%m-%d)'"'","total":0,"contenido":null}' > daily-longform.json
          fi
          TOTAL=$(node -e "const f=require('./daily-longform.json'); console.log(f.total||0)")
          echo "Resumen largo: $TOTAL fuentes"
          if [ "$TOTAL" -gt 0 ]; then echo "hay_longform=true" >> "$GITHUB_OUTPUT"; else echo "hay_longform=false" >> "$GITHUB_OUTPUT"; fi

      - name: 🛡️ Validación editorial antes de publicar
        if: steps.gen.outputs.hay_contenido == 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('daily-content.json','utf8'));
          if (!data.total || !Array.isArray(data.contenido)) throw new Error('daily-content inválido');
          for (const [i, item] of data.contenido.entries()) {
            if (!item._fuente_url || !/^https?:\/\//.test(item._fuente_url)) throw new Error(`Pieza ${i+1}: falta URL de fuente`);
            if (!item._fuente) throw new Error(`Pieza ${i+1}: falta fuente`);
            if (!item.titulo_youtube) throw new Error(`Pieza ${i+1}: falta título`);
            if (!item.descripcion_youtube || item.descripcion_youtube.length < 120) throw new Error(`Pieza ${i+1}: descripción demasiado corta`);
          }
          console.log('✅ SOURCE LOCK OK: cada pieza tiene fuente, URL, título y descripción.');
          NODE

      - name: 💾 Guardar historial + caché
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content-history.json news-cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios para guardar"
          else
            git commit -m "chore: actualizar fuentes y memoria editorial [skip ci]"
            git push
          fi

      - name: 📦 Guardar paquetes editoriales
        if: steps.gen.outputs.hay_contenido == 'true' || steps.longform.outputs.hay_longform == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: contenido-diario-${{ steps.gen.outputs.fecha }}-${{ github.run_number }}
          path: |
            daily-content.json
            daily-longform.json
          retention-days: 7

  render-upload:
    name: 🎬 Render + Shorts YouTube
    runs-on: ubuntu-latest
    needs: generate
    if: needs.generate.outputs.hay_contenido == 'true'
    timeout-minutes: 60
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5
      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: 📥 Instalar dependencias
        run: npm ci
      - name: 🔐 Validar autenticación de YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/preflight-youtube-auth.js
      - name: 🌐 Preparar Remotion
        run: |
          npx remotion browser ensure
          echo "REMOTION_CHROME_FLAGS=--no-sandbox --disable-setuid-sandbox" >> "$GITHUB_ENV"
      - name: 🎞️ Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ⚽ Obtener b-roll real de apoyo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/fetch-broll.js
      - name: 📥 Descargar paquete editorial
        uses: actions/download-artifact@v6
        with:
          name: contenido-diario-${{ needs.generate.outputs.fecha }}-${{ github.run_number }}
      - name: 🎥 Renderizar + publicar Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/render-and-upload.js
      - name: 🔎 Verificar evidencia de publicación
        run: |
          REPORT="out/reporte-${{ needs.generate.outputs.fecha }}.json"
          if [ ! -f "$REPORT" ]; then
            echo "❌ No existe el reporte de publicación: $REPORT"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
          const publicados = (report.videos || []).filter(v => v.estado === 'OK' && v.youtube_id && v.youtube_url);
          console.log(`📺 Evidencia YouTube: ${publicados.length}/${report.total} con video_id y URL`);
          if (report.total > 0 && publicados.length !== report.total) process.exit(1);
          NODE
        env:
          REPORT: out/reporte-${{ needs.generate.outputs.fecha }}.json
      - name: 💾 Backup Shorts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shorts-${{ needs.generate.outputs.fecha }}-${{ github.run_number }}
          path: out/
          retention-days: 7

  longform:
    name: 🎥 Resumen largo 16:9
    runs-on: ubuntu-latest
    needs: generate
    if: needs.generate.outputs.hay_longform == 'true'
    timeout-minutes: 60
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5
      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: 📥 Instalar dependencias
        run: npm ci
      - name: 🔐 Validar autenticación de YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/preflight-youtube-auth.js
      - name: 🌐 Preparar Remotion
        run: |
          npx remotion browser ensure
          echo "REMOTION_CHROME_FLAGS=--no-sandbox --disable-setuid-sandbox" >> "$GITHUB_ENV"
      - name: 📥 Descargar paquete editorial
        uses: actions/download-artifact@v6
        with:
          name: contenido-diario-${{ needs.generate.outputs.fecha }}-${{ github.run_number }}
      - name: 🎥 Renderizar + publicar resumen largo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/render-longform.js
      - name: 💾 Backup resumen largo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: longform-${{ needs.generate.outputs.fecha }}-${{ github.run_number }}
          path: out/
          retention-days: 14

  notify:
    name: 📊 Reporte final
    runs-on: ubuntu-latest
    needs: [generate, render-upload, longform]
    if: always()
    steps:
      - name: 📊 Estado del pipeline
        run: |
          echo "══════════════════════════════════════════════"
          echo "⚽ REAL FOOTBALL NEWSROOM v5"
          echo "Run #${{ github.run_number }}"
          echo "Generación: ${{ needs.generate.result }}"
          echo "Shorts: ${{ needs.render-upload.result }}"
          echo "Longform: ${{ needs.longform.result }}"
          if [ "${{ needs.render-upload.result }}" = "success" ]; then
            echo "✅ Shorts publicados y verificados por reporte local"
          elif [ "${{ needs.longform.result }}" = "success" ]; then
            echo "✅ Resumen largo publicado correctamente"
          elif [ "${{ needs.generate.result }}" = "success" ]; then
            echo "ℹ️ Sin publicación nueva en esta ejecución."
          else
            echo "⚠️ Falló la selección editorial"
          fi
          echo "══════════════════════════════════════════════"
          if [ "${{ needs.generate.result }}" != "success" ]; then
            echo "❌ El job de generación no terminó correctamente."
            exit 1
          fi
          if [ "${{ needs.render-upload.result }}" = "failure" ] || [ "${{ needs.render-upload.result }}" = "cancelled" ]; then
            echo "❌ La publicación de Shorts no terminó correctamente."
            exit 1
          fi
          if [ "${{ needs.longform.result }}" = "failure" ] || [ "${{ needs.longform.result }}" = "cancelled" ]; then
            echo "❌ El resumen largo no terminó correctamente."
            exit 1
          fi
