name: ⚽ MUNDIAL2026SHORTS v7 — Newsroom

on:
  push:
    branches: [main]
    paths-ignore:
      - 'content-history.json'
      - 'news-cache.json'
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Shorts máximos'
        required: false
        default: '1'
        type: choice
        options: ['1', '2']
      modo:
        description: 'Enfoque editorial'
        required: false
        default: 'chile'
        type: choice
        options: ['chile', 'auto', 'noticias']

concurrency:
  group: mundial2026shorts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  GIT_USER_NAME: 'github-actions[bot]'
  GIT_USER_EMAIL: 'github-actions[bot]@users.noreply.github.com'

jobs:
  generate:
    name: 📰 Detectar noticia + guion original
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      hay_contenido: ${{ steps.gen.outputs.hay_contenido }}
      fecha: ${{ steps.gen.outputs.fecha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Configurar Git
        run: |
          git config --global user.name "${{ env.GIT_USER_NAME }}"
          git config --global user.email "${{ env.GIT_USER_EMAIL }}"

      - name: 🔄 Sincronizar con el último main
        run: |
          git fetch origin main --prune
          git reset --hard origin/main
          git clean -fd
          echo "✅ Repositorio sincronizado con origin/main"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: 🔎 Ingerir fuentes verificables
        run: node scripts/fetch-real-news.js

      - name: ⚽ Obtener datos estructurados
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          COMPETITIONS: ${{ secrets.COMPETITIONS }}
        run: node scripts/fetch-matches.js

      - name: 🧠 Seleccionar SOLO historias con valor
        id: gen
        env:
          MAX_ITEMS: ${{ inputs.max_items || '1' }}
          MODO: ${{ inputs.modo || 'chile' }}
        run: |
          node scripts/generate-real-content.js
          FECHA=$(date -u +%Y-%m-%d)
          echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"
          TOTAL=$(node -e "const f=require('./daily-content.json'); console.log(f.total||0)")
          echo "Piezas seleccionadas: $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then echo "hay_contenido=true" >> "$GITHUB_OUTPUT"; else echo "hay_contenido=false" >> "$GITHUB_OUTPUT"; fi

      - name: 🛡️ Bloqueo editorial
        if: steps.gen.outputs.hay_contenido == 'true'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('daily-content.json','utf8'));
          if(!d.total || !Array.isArray(d.contenido)) throw new Error('daily-content inválido');
          for(const [i,x] of d.contenido.entries()){
            if(!x._fuente_url || !/^https?:\/\//.test(x._fuente_url)) throw new Error('Pieza '+(i+1)+': URL de fuente ausente');
            if(!x._fuente) throw new Error('Pieza '+(i+1)+': fuente ausente');
            if(!x.titulo_youtube) throw new Error('Pieza '+(i+1)+': título ausente');
            if(!x.narracion || x.narracion.length<180) throw new Error('Pieza '+(i+1)+': narración original insuficiente');
          }
          console.log('✅ SOURCE LOCK + ORIGINALIDAD OK');
          NODE

      - name: 💾 Guardar memoria editorial
        continue-on-error: true
        run: |
          echo "🔍 Verificando cambios en archivos de memoria..."
          
          if ! git diff --quiet content-history.json news-cache.json 2>/dev/null; then
            echo "📝 Cambios detectados, preparando commit..."
            git add content-history.json news-cache.json
            
            if ! git commit -m "chore: actualizar memoria editorial [skip ci]" --no-verify 2>/dev/null; then
              echo "⚠️  Sin cambios nuevos para commit"
              exit 0
            fi
            
            echo "🔄 Intentando sincronizar con origin/main sin rebase..."
            
            # Estrategia 1: Merge seguro con --no-rebase
            if git pull --no-rebase origin main --strategy=ours 2>/dev/null; then
              echo "✅ Merge exitoso con estrategia 'ours'"
              if git push origin HEAD:main; then
                echo "✅ Push exitoso"
              else
                echo "⚠️  Push fallido, sincronizando..."
                git fetch origin main
                git reset --hard origin/main
              fi
            else
              echo "⚠️  Merge fallido, resolviendo con estrategia de resolución..."
              
              # Abort el merge fallido
              git merge --abort 2>/dev/null || true
              
              # Resolver: preferir nuestra versión
              git checkout --ours content-history.json news-cache.json
              git add content-history.json news-cache.json
              git commit --amend --no-edit --no-verify 2>/dev/null || true
              
              # Reintentar merge
              if git pull --no-rebase origin main --strategy=ours 2>/dev/null; then
                echo "✅ Merge exitoso tras resolver conflictos"
                if git push origin HEAD:main; then
                  echo "✅ Push exitoso"
                else
                  echo "⚠️  Push fallido, sincronizando..."
                  git fetch origin main
                  git reset --hard origin/main
                fi
              else
                # Último recurso: sincronizar con remote
                echo "⚠️  Merge persistente, usando versión remota"
                git merge --abort 2>/dev/null || true
                git fetch origin main
                git reset --hard origin/main
                echo "ℹ️  Repositorio sincronizado con origin/main"
              fi
            fi
          else
            echo "ℹ️  Sin cambios en archivos de memoria editorial"
          fi

      - name: 📦 Entregar paquete
        if: steps.gen.outputs.hay_contenido == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: contenido-${{ steps.gen.outputs.fecha }}-${{ github.run_number }}
          path: daily-content.json
          retention-days: 7

  publish:
    name: 🎬 Render + publicar Short
    runs-on: ubuntu-latest
    needs: generate
    if: needs.generate.outputs.hay_contenido == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: 🔐 Comprobar YouTube OAuth
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/preflight-youtube-auth.js

      - name: 🌐 Preparar Remotion
        run: |
          npx remotion browser ensure
          echo "REMOTION_CHROME_FLAGS=--no-sandbox --disable-setuid-sandbox" >> "$GITHUB_ENV"

      - name: 🎞️ Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 📥 Descargar paquete
        uses: actions/download-artifact@v6
        with:
          name: contenido-${{ needs.generate.outputs.fecha }}-${{ github.run_number }}

      - name: 🎥 Renderizar + publicar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/render-and-upload.js

      - name: 🔎 Verificar publicación
        env:
          REPORT: out/reporte-${{ needs.generate.outputs.fecha }}.json
        run: |
          test -f "$REPORT"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.REPORT,'utf8'));
          const ok=(r.videos||[]).filter(v=>v.estado==='OK'&&v.youtube_id&&v.youtube_url);
          console.log('YouTube: '+ok.length+'/'+r.total);
          if(r.total>0 && ok.length!==r.total) process.exit(1);
          NODE

      - name: 💾 Backup
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: short-${{ needs.generate.outputs.fecha }}-${{ github.run_number }}
          path: out/
          retention-days: 7

  report:
    name: 📊 Estado final
    runs-on: ubuntu-latest
    needs: [generate, publish]
    if: always()
    steps:
      - run: |
          echo "⚽ MUNDIAL2026SHORTS v7"
          echo "════════════════════════════════════════"
          echo "Generación: ${{ needs.generate.result }}"
          echo "Publicación: ${{ needs.publish.result }}"
          echo "════════════════════════════════════════"
          if [ "${{ needs.generate.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.publish.result }}" = "failure" ] || [ "${{ needs.publish.result }}" = "cancelled" ]; then exit 1; fi
