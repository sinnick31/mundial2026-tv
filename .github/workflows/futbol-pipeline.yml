name: ⚽ CHILENSIS FÚTBOL — Newsroom

on:
  # Los pushes de código ejecutan validación, nunca publican automáticamente.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/futbol-pipeline.yml'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Shorts máximos'
        required: false
        default: '1'
        type: choice
        options: ['1', '2']
      modo:
        description: 'Enfoque editorial'
        required: false
        default: 'chile'
        type: choice
        options: ['chile', 'auto', 'noticias']
      privacy:
        description: 'Visibilidad del vídeo subido'
        required: true
        default: 'private'
        type: choice
        options: ['unlisted', 'private', 'public']
      render_only:
        description: 'Solo renderizar y validar, sin subir a YouTube'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

concurrency:
  group: mundial2026shorts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  validate-push:
    if: github.event_name == 'push'
    name: 🧪 Validar cambios de código sin publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validar sintaxis, política editorial y TypeScript
        run: |
          node --check scripts/editorial-gate.js
          node --check scripts/generate-real-content.js
          node --check scripts/fetch-real-news.js
          node --check scripts/viral-score.js
          node --check scripts/render-and-upload.js
          node --check scripts/text-sanitizer.js
          node --check scripts/publication-policy.js
          npm run test:all
          node -e "JSON.parse(require('fs').readFileSync('tsconfig.json','utf8'))"
          npx tsc --noEmit

  generate:
    if: github.event_name != 'push'
    name: 📰 Detectar noticia + guion original
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      hay_contenido: ${{ steps.gen.outputs.hay_contenido }}
      fecha: ${{ steps.gen.outputs.fecha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: 🧪 Validar scripts de noticias
        run: |
          node --check scripts/fetch-real-news.js
          node --check scripts/generate-real-content.js
          node --check scripts/viral-score.js
          node --check scripts/generate-results-longform.js
          node --check scripts/reconcile-editorial-state.js
          node --test tests/editorial-state-merge.test.js

      - name: 🔎 Ingerir fuentes verificables
        run: node scripts/fetch-real-news.js

      - name: ⚽ Obtener datos estructurados
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          COMPETITIONS: ${{ secrets.COMPETITIONS }}
        run: node scripts/fetch-matches.js

      - name: 🧠 Seleccionar SOLO historias con valor
        id: gen
        env:
          MAX_ITEMS: ${{ inputs.max_items || '1' }}
          MODO: ${{ inputs.modo || 'chile' }}
        run: |
          node scripts/generate-real-content.js
          node --check scripts/retention-package.js
          node scripts/retention-package.js daily-content.json
          FECHA=$(date -u +%Y-%m-%d)
          echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"
          TOTAL=$(node -e "const f=require('./daily-content.json'); console.log(f.total||0)")
          echo "Piezas seleccionadas: $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then echo "hay_contenido=true" >> "$GITHUB_OUTPUT"; else echo "hay_contenido=false" >> "$GITHUB_OUTPUT"; fi

      - name: 🛡️ Bloqueo editorial Chilensis Fútbol
        if: steps.gen.outputs.hay_contenido == 'true'
        run: |
          node --check scripts/editorial-gate.js
          node scripts/editorial-gate.js daily-content.json
          npm run test:editorial-gate

      - name: 💾 Guardar memoria editorial
        env:
          RENDER_ONLY: ${{ inputs.render_only || 'true' }}
        run: |
          if [ "$RENDER_ONLY" = "true" ]; then
            echo "ℹ️ Render-only: no se modifica la memoria editorial del repositorio."
            exit 0
          fi
          # Editorial history is stateful: never overwrite newer remote history.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this publishing workflow from main only; refusing to update editorial memory from another branch."
            exit 1
          fi

          if git diff --quiet -- content-history.json news-cache.json 2>/dev/null; then
            echo "ℹ️ Sin cambios en memoria editorial"
            exit 0
          fi

          # Fetch first, then union this run's generated state with the latest remote JSON.
          # This avoids committing against a stale parent and preserves concurrent editorial entries.
          git fetch origin main
          node scripts/reconcile-editorial-state.js

          # Move HEAD and the index to the fetched main while keeping generated JSON in the worktree.
          # No hard reset, force push, or overwrite of unrelated repository files.
          git reset --mixed origin/main
          git add -- content-history.json news-cache.json
          if git diff --cached --quiet; then
            echo "ℹ️ La reconciliación no produjo cambios que guardar"
            exit 0
          fi
          git commit -m "chore: reconciliar memoria editorial [skip ci]" --no-verify

          # If main advances after the fetch, the normal push rejects safely. Never force-push.
          git push origin HEAD:main

      - name: 📦 Entregar paquete
        if: steps.gen.outputs.hay_contenido == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: contenido-${{ steps.gen.outputs.fecha }}-${{ github.run_number }}
          path: daily-content.json
          retention-days: 7

  publish:
    name: 🎬 Render + validar/publicar Short
    runs-on: ubuntu-latest
    needs: generate
    if: github.event_name != 'push' && needs.generate.outputs.hay_contenido == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: 🧪 Validar render y TypeScript antes de publicar
        run: |
          node --check scripts/render-and-upload.js
          node --check scripts/publication-policy.js
          node --check scripts/content-quality-gate.js
          node --check scripts/text-sanitizer.js
          node --check scripts/validate-rendered-video.js
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('scripts/render-and-upload.js', 'utf8');
          const required = ['async function main()', 'main().catch', 'function renderVideo(', 'async function uploadToYouTube(', 'validateRenderedVideo('];
          const missing = required.filter(token => !source.includes(token));
          if (missing.length) {
            console.error('::error::render-and-upload.js no contiene el punto de entrada o funciones obligatorias: ' + missing.join(', '));
            process.exit(1);
          }
          console.log('Render/upload entrypoint OK: ' + required.join(', '));
          NODE
          npm run test:publication-policy
          node --test tests/content-quality-gate.test.js
          # Si tsconfig.json/eslint.config.js se corrompen (p. ej. con "\n" literales), tsc ignora la
          # config y reporta cientos de errores falsos en node_modules/@types. Fallar aquí con un mensaje claro.
          node -e "JSON.parse(require('fs').readFileSync('tsconfig.json','utf8'))" || { echo "::error file=tsconfig.json::tsconfig.json no es JSON válido (¿saltos de línea escapados?)"; exit 1; }
          npx tsc --noEmit

      - name: 🔐 Validar YouTube OAuth v8
        if: inputs.render_only == 'false'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: UCQbAT9x3pVmV5oRAtwoKmKA
        run: node scripts/preflight-youtube-auth.js

      - name: 🌐 Preparar Remotion
        run: |
          npx remotion browser ensure
          echo "REMOTION_CHROME_FLAGS=--no-sandbox --disable-setuid-sandbox" >> "$GITHUB_ENV"

      - name: 🎞️ Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 🏟️ Preparar clips visuales para evitar fondos vacíos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          node scripts/fetch-broll.js
          node - <<'NODE'
          const fs = require('fs');
          const path = 'public/broll';
          const clips = fs.existsSync(path) ? fs.readdirSync(path).filter(f => /\.mp4$/i.test(f)) : [];
          console.log('Clips visuales disponibles:', clips.length);
          if (!clips.length) {
            console.error('::error::No hay clips visuales. Se bloquea la publicación para evitar un Short sin imágenes.');
            process.exit(1);
          }
          NODE

      - name: 📥 Descargar paquete
        uses: actions/download-artifact@v6
        with:
          name: contenido-${{ needs.generate.outputs.fecha }}-${{ github.run_number }}
          path: .

      - name: 🔎 Verificar paquete de contenido descargado
        shell: bash
        run: |
          echo "[diagnóstico] directorio: $PWD"
          find . -maxdepth 3 -type f -name 'daily-content.json' -print
          if [ ! -s daily-content.json ]; then
            echo "::error::No se descargó daily-content.json en la raíz del workspace. Revisa el artefacto generado y su estructura."
            find . -maxdepth 3 -type f | sort | tail -n 100
            exit 1
          fi
          node -e "const f=require('./daily-content.json'); if(!Array.isArray(f.contenido)||!f.total||f.total!==f.contenido.length) { console.error('::error::daily-content.json tiene un formato o total incoherente'); process.exit(1) } console.log('Paquete válido:', f.total, 'pieza(s), fecha', f.fecha)"

      - name: 🎥 Renderizar + publicar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TEAM_IMAGES_JSON: ${{ secrets.TEAM_IMAGES_JSON }}
          TEAM_BROLL_MANIFEST: ${{ secrets.TEAM_BROLL_MANIFEST }}
          RENDER_ONLY: ${{ inputs.render_only || 'true' }}
          YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy || vars.SCHEDULED_VIDEO_PRIVACY || 'private' }}
          ALLOW_SCHEDULED_PUBLIC: 'false'
        run: node scripts/render-and-upload.js

      - name: 🔎 Verificar publicación
        env:
          REPORT: out/reporte-${{ needs.generate.outputs.fecha }}.json
          RENDER_ONLY: ${{ inputs.render_only || 'true' }}
        run: |
          echo "[diagnóstico] REPORT=${REPORT}"
          echo "[diagnóstico] pwd=$(pwd)"
          echo "[diagnóstico] ls -la"
          ls -la
          echo "[diagnóstico] ls -la out || true"
          ls -la out || true
          echo "[diagnóstico] find . -maxdepth 3 -type f | sort | tail -n 200"
          find . -maxdepth 3 -type f | sort | tail -n 200 || true

          if [ ! -f "$REPORT" ]; then
            echo "::error::Fichero faltante: $REPORT"
            echo "::error::No existe el reporte esperado. Comprueba la salida de script/render-and-upload.js y el nombre exacto del archivo generado."
            exit 1
          fi

          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.REPORT,'utf8'));
          const renderOnly=String(process.env.RENDER_ONLY||'').toLowerCase()==='true';
          if (renderOnly) {
            const rendered=(r.videos||[]).filter(v=>v.estado==='RENDERED_LOCAL'&&v.archivo_local&&v.calidad);
            console.log('Render local validado: '+rendered.length+'/'+r.total);
            if(r.modo!=='render-only'||r.total===0||rendered.length!==r.total) process.exit(1);
          } else {
            const ok=(r.videos||[]).filter(v=>v.estado==='OK'&&v.youtube_id&&v.youtube_url);
            console.log('YouTube: '+ok.length+'/'+r.total);
            if(r.total===0||ok.length!==r.total) process.exit(1);
          }
          NODE

      - name: 💾 Backup
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: short-${{ needs.generate.outputs.fecha }}-${{ github.run_number }}
          path: out/
          retention-days: 7

  report:
    name: 📊 Estado final
    runs-on: ubuntu-latest
    needs: [validate-push, generate, publish]
    if: always()
    steps:
      - run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "Validación de código: ${{ needs.validate-push.result }}"
            test "${{ needs.validate-push.result }}" = "success"
            echo "Push validado. No se generó ni publicó contenido."
            exit 0
          fi
          echo "⚽ CHILENSIS FÚTBOL — Newsroom"
          echo "════════════════════════════════════════"
          echo "Generación: ${{ needs.generate.result }}"
          echo "Publicación: ${{ needs.publish.result }}"
          echo "════════════════════════════════════════"
          if [ "${{ needs.generate.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.publish.result }}" = "failure" ] || [ "${{ needs.publish.result }}" = "cancelled" ]; then exit 1; fi
