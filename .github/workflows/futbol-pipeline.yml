name: ⚽ REAL FOOTBALL NEWSROOM v5 — Chile 365

# Canal editorial de fútbol chileno con trazabilidad de fuentes.
# La automatización NO inventa resultados, cifras, fichajes ni declaraciones.
# Prioridad: 1) Colo-Colo, 2) fútbol chileno, 3) futbolistas chilenos en el exterior.
# Se publican como máximo 3 Shorts/día para evitar una línea de producción masiva.

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 20 * * *'
    - cron: '0 1 * * *'

  workflow_dispatch:
    inputs:
      max_items:
        description: 'Máximo de videos en esta ejecución'
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3']
      modo:
        description: 'Enfoque editorial'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'noticias', 'chile']

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  generate:
    name: 📰 Fuentes reales + selección editorial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      hay_contenido: ${{ steps.gen.outputs.hay_contenido }}
      fecha: ${{ steps.gen.outputs.fecha }}

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Instalar dependencias
        run: npm ci

      - name: 🔍 Ingerir fuentes reales
        run: node scripts/fetch-real-news.js

      - name: ⚽ Obtener datos estructurados de fútbol internacional
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          COMPETITIONS: ${{ secrets.COMPETITIONS }}
        run: node scripts/fetch-matches.js

      - name: 🧭 Generar paquete editorial source-locked
        id: gen
        env:
          MAX_ITEMS: ${{ inputs.max_items || '1' }}
          MODO: ${{ inputs.modo || 'auto' }}
        run: |
          node scripts/generate-real-content.js
          FECHA=$(date -u +%Y-%m-%d)
          echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"
          TOTAL=$(node -e "const f=require('./daily-content.json'); console.log(f.total||0)")
          echo "📊 Piezas verificables seleccionadas: $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then
            echo "hay_contenido=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_contenido=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🛡️ Validación editorial antes de publicar
        if: steps.gen.outputs.hay_contenido == 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('daily-content.json','utf8'));
          if (!data.total || !Array.isArray(data.contenido)) throw new Error('daily-content inválido');
          for (const [i, item] of data.contenido.entries()) {
            if (!item._fuente_url || !/^https?:\/\//.test(item._fuente_url)) throw new Error(`Pieza ${i+1}: falta URL de fuente`);
            if (!item._fuente) throw new Error(`Pieza ${i+1}: falta fuente`);
            if (!item.descripcion_youtube || item.descripcion_youtube.length < 120) throw new Error(`Pieza ${i+1}: descripción demasiado corta`);
          }
          console.log('✅ Source lock OK: toda pieza tiene fuente y URL verificable.');
          NODE

      - name: 💾 Guardar historial + caché
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content-history.json news-cache.json 2>/dev/null || true
          git diff --staged --quiet && echo "Sin cambios para guardar" || git commit -m "chore: actualizar fuentes y memoria editorial [skip ci]"
          git push || echo "Sin cambios que pushear"

      - name: 📦 Guardar paquete editorial
        if: steps.gen.outputs.hay_contenido == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: contenido-diario-${{ steps.gen.outputs.fecha }}-${{ github.run_number }}
          path: daily-content.json
          retention-days: 7

  render-upload:
    name: 🎬 Render + publicación YouTube
    runs-on: ubuntu-latest
    needs: generate
    if: needs.generate.outputs.hay_contenido == 'true'
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Instalar dependencias
        run: npm ci

      - name: 🌐 Preparar Remotion
        run: |
          npx remotion browser ensure
          echo "REMOTION_CHROME_FLAGS=--no-sandbox --disable-setuid-sandbox" >> "$GITHUB_ENV"

      - name: 🎞️ Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: ⚽ Obtener b-roll real de apoyo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/fetch-broll.js

      - name: 📥 Descargar paquete editorial
        uses: actions/download-artifact@v6
        with:
          name: contenido-diario-${{ needs.generate.outputs.fecha }}-${{ github.run_number }}

      - name: 🎥 Renderizar + publicar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/render-and-upload.js

      - name: 💾 Backup del resultado
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: videos-${{ needs.generate.outputs.fecha }}-${{ github.run_number }}
          path: out/
          retention-days: 7

  notify:
    name: 📊 Reporte final
    runs-on: ubuntu-latest
    needs: [generate, render-upload]
    if: always()
    steps:
      - name: 📊 Estado del pipeline
        run: |
          echo "══════════════════════════════════════════════"
          echo "⚽ REAL FOOTBALL NEWSROOM v5"
          echo "Run #${{ github.run_number }}"
          echo "Generación: ${{ needs.generate.result }}"
          echo "Publicación: ${{ needs.render-upload.result }}"
          if [ "${{ needs.render-upload.result }}" == "success" ]; then
            echo "✅ Contenido real publicado"
          elif [ "${{ needs.generate.outputs.hay_contenido }}" == "false" ]; then
            echo "ℹ️ No apareció una fuente suficientemente nueva/distinta. No se rellenó con IA."
          else
            echo "⚠️ Revisar job de render/publicación"
          fi
          echo "══════════════════════════════════════════════"
