name: Pipeline guard tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'fix/**'

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check changed JavaScript syntax
        run: |
          node --check scripts/check-media-rights.js
          node --check scripts/content-history.js
          node --check scripts/generate-real-content.js
          node --check scripts/render-and-upload.js
          node --check scripts/fetch-matches.js
      - name: Test source deduplication
        run: node --test scripts/pipeline-guards.test.js
