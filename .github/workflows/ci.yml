name: Editorial system checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/publication-policy.js'
      - 'scripts/editorial-gate.js'
      - 'scripts/generate-real-content.js'
      - 'scripts/viral-score.js'
      - 'scripts/fetch-real-news.js'
      - 'scripts/render-and-upload.js'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/futbol-pipeline.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/resultados-largos-diarios.yml'
      - 'scripts/fetch-matches.js'
      - 'config/**'
      - 'scripts/generate-results-longform.js'
      - 'scripts/generate-narration.js'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'scripts/publication-policy.js'
      - 'scripts/editorial-gate.js'
      - 'scripts/generate-real-content.js'
      - 'scripts/viral-score.js'
      - 'scripts/fetch-real-news.js'
      - 'scripts/render-and-upload.js'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/futbol-pipeline.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/resultados-largos-diarios.yml'
      - 'scripts/fetch-matches.js'
      - 'config/**'
      - 'scripts/generate-results-longform.js'
      - 'scripts/generate-narration.js'
      - 'src/**'

permissions:
  contents: read

jobs:
  quality-gates:
    name: Publication policy and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check scripts/publication-policy.js
          node --check scripts/editorial-gate.js
          node --check scripts/generate-real-content.js
          node --check scripts/viral-score.js
          node --check scripts/fetch-real-news.js
          node --check scripts/render-and-upload.js
          node --check scripts/fetch-matches.js
          node --check scripts/generate-results-longform.js
          node --check scripts/preflight-youtube-auth.js

      - name: Test editorial and upload policy
        run: npm run test:all

      - name: Type-check Remotion components
        run: npx tsc --noEmit
